name: Verify recommendation lab
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_recommendations
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ecommerce_recommendations"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/ecommerce_recommendations
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/ecommerce_recommendations
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: |
          pip install --only-binary=:all: -r backend/requirements.txt
      - name: Backend and PostgreSQL migration tests
        working-directory: backend
        run: python -m pytest -q
      - name: Install frontend and test browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - name: Train from the attributed public dataset
        working-directory: backend
        run: python -m src.train_model
      - name: Migrate and seed the demo
        working-directory: backend
        run: |
          alembic upgrade head
          python -m src.seed_database
          python -m src.seed_database
      - name: Start API and check readiness
        working-directory: backend
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/retail-api.log 2>&1 &
          node --input-type=module <<'JS'
          for (let attempt = 0; attempt < 30; attempt++) {
            try { if ((await fetch('http://127.0.0.1:8000/ready')).ok) process.exit(0); } catch {}
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
          process.exit(1);
          JS
      - name: Desktop and mobile browser tests
        working-directory: frontend
        run: npm test
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: frontend/test-results
      - name: Print API logs on failure
        if: failure()
        run: cat /tmp/retail-api.log 2>/dev/null || true

  native:
    name: Native PostgreSQL launcher
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LOCAL_PG_BIN: /usr/lib/postgresql/16/bin
      RUN_NATIVE_LOCAL_TESTS: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install native PostgreSQL and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
          python -m pip install --only-binary=:all: -r backend/requirements.txt
      - name: Prepare the real-data model
        working-directory: backend
        run: python -m src.train_model
      - name: Verify native startup, Ctrl+C, restart and stop
        run: python -m pytest scripts/tests -q
